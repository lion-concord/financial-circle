name: Deploy VK Mini App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Установить зависимости
        run: npm install --prefix apps/vk-mini-app --no-audit --no-fund

      - name: Собрать Mini App
        run: npm run build --prefix apps/vk-mini-app

      - name: Настроить Pages
        uses: actions/configure-pages@v5

      - name: Загрузить сборку
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/vk-mini-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
